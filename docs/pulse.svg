<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Campus Pulse and its six weighted parts"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1017"/><stop offset="1" stop-color="#141a2c"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b9cff"/><stop offset="1" stop-color="#5cc8ff"/></linearGradient>
<filter id="glow" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)" stroke="#232834"/>
<circle cx="215" cy="185" r="105" fill="none" stroke="#232834" stroke-width="18"/>
<circle cx="215" cy="185" r="105" fill="none" stroke="url(#ac)" stroke-width="18" stroke-linecap="round" stroke-dasharray="659.7" stroke-dashoffset="659.7" transform="rotate(-90 215 185)" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="659.7;118.7;118.7" keyTimes="0;.3;1" dur="8s" repeatCount="indefinite"/></circle>
<text x="215" y="133" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="4" fill="#8b93a5">CAMPUS PULSE</text>
<text x="215" y="229" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#eef1f6">82</text>
<text x="215" y="255" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b93a5">/ 100  example</text>
<text x="470" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f6">Six parts, one score</text>
<text x="470" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#8b93a5">Bar length shows how much each part counts. The weights are shown in the app too.</text>
<text x="470" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#eef1f6">Campus Crowd</text><text x="1130" y="96" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#5cc8ff">25%</text><rect x="470" y="105" width="600" height="9" rx="4.5" fill="#232834"/><rect x="470" y="105" width="0" height="9" rx="4.5" fill="#5cc8ff" filter="url(#glow)"><animate attributeName="width" values="0;600;600" keyTimes="0;.25;1" dur="8s" begin="0.00s" repeatCount="indefinite"/></rect><text x="470" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#eef1f6">Energy</text><text x="1130" y="138" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#ffb84d">20%</text><rect x="470" y="147" width="600" height="9" rx="4.5" fill="#232834"/><rect x="470" y="147" width="0" height="9" rx="4.5" fill="#ffb84d" filter="url(#glow)"><animate attributeName="width" values="0;480;480" keyTimes="0;.25;1" dur="8s" begin="0.25s" repeatCount="indefinite"/></rect><text x="470" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#eef1f6">Student Activity</text><text x="1130" y="180" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#8b9cff">15%</text><rect x="470" y="189" width="600" height="9" rx="4.5" fill="#232834"/><rect x="470" y="189" width="0" height="9" rx="4.5" fill="#8b9cff" filter="url(#glow)"><animate attributeName="width" values="0;360;360" keyTimes="0;.25;1" dur="8s" begin="0.50s" repeatCount="indefinite"/></rect><text x="470" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#eef1f6">Safety</text><text x="1130" y="222" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#3ddc97">15%</text><rect x="470" y="231" width="600" height="9" rx="4.5" fill="#232834"/><rect x="470" y="231" width="0" height="9" rx="4.5" fill="#3ddc97" filter="url(#glow)"><animate attributeName="width" values="0;360;360" keyTimes="0;.25;1" dur="8s" begin="0.75s" repeatCount="indefinite"/></rect><text x="470" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#eef1f6">Problems</text><text x="1130" y="264" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#ff5d6c">15%</text><rect x="470" y="273" width="600" height="9" rx="4.5" fill="#232834"/><rect x="470" y="273" width="0" height="9" rx="4.5" fill="#ff5d6c" filter="url(#glow)"><animate attributeName="width" values="0;360;360" keyTimes="0;.25;1" dur="8s" begin="1.00s" repeatCount="indefinite"/></rect><text x="470" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#eef1f6">Water</text><text x="1130" y="306" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#7dd3fc">10%</text><rect x="470" y="315" width="600" height="9" rx="4.5" fill="#232834"/><rect x="470" y="315" width="0" height="9" rx="4.5" fill="#7dd3fc" filter="url(#glow)"><animate attributeName="width" values="0;240;240" keyTimes="0;.25;1" dur="8s" begin="1.25s" repeatCount="indefinite"/></rect>
</svg>